  <style>
:root{--night:#010C1B;--navy:#233C5D;--bord:#6F1722;--bord2:#8A2130;--beige:#F3F0E9;--beige2:#EAE5D8;--white:#fff;--line:rgba(243,240,233,.28);--r:12px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Lato",sans-serif;font-size:18px;line-height:1.5;color:var(--beige);background:var(--night);min-height:100vh}
h1,h2,h3,.btn,.pill,label,th,.brand-title .t,.toast .tt{font-family:"Advent Pro",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:40px 20px 56px;position:relative;z-index:1}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 0 16px;margin-bottom:26px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px}
.logo{height:34px;width:auto;display:block}
.brand-title .t{font-weight:700;font-size:15px;color:var(--white)}
.brand-title .s{font-size:14px;color:var(--beige2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{border-radius:999px;display:inline-flex;align-items:center;gap:6px;padding:4px 14px;font-size:13px;font-weight:500;border:1px solid var(--line);color:var(--beige);background:transparent}
.pill:empty{display:none}
.pill-profile{background:var(--bord);border-color:var(--bord);color:var(--white)}
.card{background:transparent;border:none}
.card-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding:0 0 22px}
.card-h>div:first-child{flex:1}
.card-h h2{margin:0 0 10px;font-size:14px;font-weight:500;color:var(--beige2)}
.card-b{padding:0}
.progress{border-radius:99px;height:3px;background:var(--line);overflow:hidden}
.progress>div{border-radius:99px;height:100%;width:0;background:var(--white);transition:width .3s}
.btn{appearance:none;cursor:pointer;font-size:15px;font-weight:700;padding:11px 22px;border:1px solid var(--white);background:transparent;color:var(--white);border-radius:var(--r);transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:var(--white);color:var(--night)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.red{background:var(--bord);border-color:var(--bord);color:var(--white)}
.btn.red:hover{background:var(--white);border-color:var(--white);color:var(--bord)}
.btn.ghost{background:transparent;color:var(--white)}
.btn.navy{background:var(--white);color:var(--night)}
.btn.navy:hover{background:transparent;color:var(--white)}
#btnRestart{padding:8px 16px;font-size:14px}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,.opt:focus-visible{outline:2px solid var(--white);outline-offset:2px}
.q-title{margin:0 0 8px;font-size:24px;line-height:1.25;font-weight:700;color:var(--white)}
.q-help{margin:8px 0 0;font-size:17px;color:var(--beige)}
.q-help b{color:var(--white)}
.options{display:grid;gap:10px;margin-top:20px}
.opt{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:14px 18px;border:1px solid var(--line);background:transparent;color:var(--beige);border-radius:var(--r);transition:background .15s,color .15s,border-color .15s}
.opt:hover{border-color:var(--white);color:var(--white)}
.opt.sel{background:#F6F4F0;border-color:#F6F4F0;color:var(--night)}
.opt .lab{flex:1}
.opt .sc{display:none}
.resultBox{background:transparent;border:none;padding:0}
.resultBox h3{color:var(--white)}
.sep{height:1px;background:var(--line);margin:20px 0}
.muted{color:var(--beige2)}
.field label{display:block;font-size:14px;font-weight:500;color:var(--beige2);margin-bottom:4px}
input,textarea{width:100%;font-family:"Lato",sans-serif;font-size:17px;color:var(--white);background:rgba(243,240,233,.06);border:1px solid var(--line);padding:11px 13px;border-radius:var(--r)}
input::placeholder{color:rgba(243,240,233,.5)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}
th{color:var(--beige2);font-weight:500;font-size:14px}
tr:last-child td{border-bottom:none}
td b{color:var(--white)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--white);color:var(--night);padding:12px 18px;border-radius:var(--r);z-index:20;max-width:90vw;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast p{margin:0}.toast .tt{font-weight:700}.toast .tm{font-size:15px}
.hero .logo-hero{height:46px;width:auto;display:block;margin:0 0 28px}
.hero h1{margin:0 0 10px;font-size:clamp(34px,5.4vw,56px);line-height:1.05;font-weight:700;color:var(--white)}
.hero h1 em{font-style:normal;color:var(--beige2)}
.hero .lead{margin:0;font-size:22px;color:var(--beige)}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.hero .meta{margin-top:20px;font-size:15px;color:var(--beige2)}
.hero .note{margin-top:12px;max-width:480px;font-size:16px;color:var(--beige2)}

/* =====================
   Wizard flow:
   - Intro
   - Cover per pillar
   - Question pages
   - Result page + profile + email module (calls /api/send-report)
===================== */

const STORAGE_KEY = "diag_marketing_v1";

const view = document.getElementById("view");
const viewTitle = document.getElementById("viewTitle");
const progressBar = document.getElementById("progressBar");
const topbar = document.getElementById("topbar");
const pillStep = document.getElementById("pillStep");
const pillPillar = document.getElementById("pillPillar");
const navTop = document.getElementById("navTop");
const btnRestart = document.getElementById("btnRestart");

const toastEl = document.getElementById("toast");
const toastT = document.getElementById("toastT");
const toastM = document.getElementById("toastM");

let state = loadState() || {
  step: "intro",             // intro | cover | question | result
  coverIndex: 0,             // 0..5
  qIndex: 0,                 // 0..QUESTIONS.length-1
  answers: {},               // qid => 'A'|'B'|'C'|'D'
};

btnRestart?.addEventListener("click", () => {
  if (!confirm("Recommencer et effacer les réponses ?")) return;
  state = { step:"intro", coverIndex:0, qIndex:0, answers:{} };
  saveState();
  render();
});

function render(){
  const totalScreens = 1 + PILLARS.length + QUESTIONS.length + 1; // intro + 6 covers + 24 Q + result
  let currentScreen = 1;

  if (state.step === "intro") currentScreen = 1;
  else if (state.step === "cover") currentScreen = 1 + (state.coverIndex + 1);
  else if (state.step === "question") currentScreen = 1 + PILLARS.length + (state.qIndex + 1);
  else currentScreen = totalScreens;

  const prog = Math.round((currentScreen / totalScreens) * 100);
  progressBar.style.width = prog + "%";

  // Top bar hidden on intro, visible after
  const showTop = state.step !== "intro";
  topbar.style.display = showTop ? "flex" : "none";
  navTop.style.display = showTop ? "flex" : "none";

  document.body.classList.toggle("is-intro", state.step === "intro");
  document.querySelectorAll(".js-logo").forEach(i => { if(!i.src || i.getAttribute("src")!==LOGO_WEB) i.src = LOGO_WEB; });

  if (state.step === "intro") return renderIntro();
  if (state.step === "cover") return renderCover();
  if (state.step === "question") return renderQuestion();
  return renderResult();
}

function renderIntro(){
  viewTitle.textContent = "Accueil";
  view.innerHTML = `
    <div class="hero">
      <img class="logo-hero js-logo" alt="Logo Pro.pulse" />
      <h1>Diagnostic <em>marketing</em></h1>
      <p class="lead">Votre stratégie est-elle à votre hauteur ?</p>
      <div class="hero-actions">
        <button class="btn red" id="btnStart">Démarrer le diagnostic</button>
        <button class="btn ghost" id="btnReset">Réinitialiser</button>
      </div>
      <p class="meta">6 piliers, 1 question par page, résultat, profil et rapport PDF. Temps estimé : 6 à 10 minutes.</p>
      <p class="note">Répondez de manière factuelle. Le diagnostic s'appuie sur vos choix pour générer un profil et recommander l'accompagnement adapté.</p>
    </div>
  `;
  document.querySelectorAll(".js-logo").forEach(i => { i.src = LOGO_WEB; });

  document.getElementById("btnStart").addEventListener("click", () => {
    state.step = "cover";
    state.coverIndex = 0;
    saveState();
    render();
  });
  document.getElementById("btnReset").addEventListener("click", () => {
    if (!confirm("Effacer les réponses enregistrées ?")) return;
    localStorage.removeItem(STORAGE_KEY);
    state = { step:"intro", coverIndex:0, qIndex:0, answers:{} };
    render();
  });
}

function renderCover(){
  const p = PILLARS[state.coverIndex];
  viewTitle.textContent = "Pilier";
  pillStep.textContent = `Pilier ${state.coverIndex+1}/${PILLARS.length}`;
  pillPillar.textContent = p.label;

  view.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="resultBox">
        <h2 class="q-title" style="margin:0;">${escapeHtml(p.coverTitle)}</h2>
        <p class="q-help">${escapeHtml(p.coverText)}</p>
      </div>

      <div class="row">
        <button class="btn ghost" id="btnBackIntro">Retour</button>
        <button class="btn red" id="btnGo">Continuer</button>
      </div>
    </div>
  `;

  document.getElementById("btnBackIntro").addEventListener("click", () => {
    if (state.coverIndex === 0 && Object.keys(state.answers).length === 0){
      state.step = "intro";
    } else {
      // revient sur écran précédent logique: si coverIndex>0 => dernière question du pilier précédent
      if (state.coverIndex > 0){
        state.step = "question";
        // positionner sur dernière question du pilier précédent
        const prevPillarKey = PILLARS[state.coverIndex-1].key;
        const idx = lastQuestionIndexForPillar(prevPillarKey);
        state.qIndex = Math.max(0, idx);
      } else {
        state.step = "intro";
      }
    }
    saveState(); render();
  });

  document.getElementById("btnGo").addEventListener("click", () => {
    // Start pillar questions
    state.step = "question";
    state.qIndex = firstQuestionIndexForPillar(p.key);
    saveState();
    render();
  });
}

function renderQuestion(){
  const q = QUESTIONS[state.qIndex];
  const p = PILLARS.find(x => x.key === q.pillar);
  viewTitle.textContent = "Question";
  pillStep.textContent = `Q ${state.qIndex+1}/${QUESTIONS.length}`;
  pillPillar.textContent = p?.label || "";

  const chosen = state.answers[q.id];

  view.innerHTML = `
    <div class="resultBox">
      <h2 class="q-title">${escapeHtml(q.title)}</h2>
      ${q.help ? `<p class="q-help">${escapeHtml(q.help)}</p>` : ``}
      <div class="options" id="opts">
        ${["A","B","C","D"].map(k => `
          <div class="opt ${chosen===k ? "sel":""}" data-k="${k}">
            <div class="lab"><b>${k}</b>. ${escapeHtml(q.options[k])}</div>
            <div class="sc"></div>
          </div>
        `).join("")}
      </div>
    </div>

    <div class="row" style="margin-top:14px;">
      <button class="btn ghost" id="btnPrev">Précédent</button>
      <button class="btn red" id="btnNext">${state.qIndex === QUESTIONS.length-1 ? "Voir les résultats" : "Suivant"}</button>
    </div>
  `;

  document.querySelectorAll("[data-k]").forEach(el => {
    el.addEventListener("click", () => {
      const k = el.getAttribute("data-k");
      state.answers[q.id] = k;
      saveState();
      render(); // refresh selection
    });
  });

  document.getElementById("btnPrev").addEventListener("click", () => {
    // If at first question of a pillar, go back to its cover
    if (isFirstQuestionOfPillar(state.qIndex)){
      const pillarIndex = PILLARS.findIndex(x => x.key === q.pillar);
      state.step = "cover";
      state.coverIndex = Math.max(0, pillarIndex);
      saveState(); render();
      return;
    }
    state.qIndex = Math.max(0, state.qIndex - 1);
    saveState(); render();
  });

  document.getElementById("btnNext").addEventListener("click", () => {
    if (!state.answers[q.id]){
      toast("Réponse manquante", "Choisissez A, B, C ou D pour continuer.");
      return;
    }

    // If leaving last question of a pillar, go to next pillar cover (if any)
    if (isLastQuestionOfPillar(state.qIndex)){
      const pillarIndex = PILLARS.findIndex(x => x.key === q.pillar);
      if (pillarIndex < PILLARS.length - 1){
        state.step = "cover";
        state.coverIndex = pillarIndex + 1;
        saveState(); render();
        return;
      }
    }

    // end
    if (state.qIndex >= QUESTIONS.length - 1){
      state.step = "result";
      saveState(); render();
      return;
    }

    state.qIndex += 1;
    saveState(); render();
  });
}

/* =====================
   Scoring
===================== */
function computePillarScores(answers){
  const out = {};
  for (const p of PILLARS) out[p.key] = 0;

  // accumulate per pillar
  const sums = {};
  const counts = {};
  for (const q of QUESTIONS){
    const a = answers[q.id];
    if (!a) continue;
    const s = SCORE_MAP[a] ?? 0;
    sums[q.pillar] = (sums[q.pillar] ?? 0) + s;
    counts[q.pillar] = (counts[q.pillar] ?? 0) + 1;
  }
  for (const p of PILLARS){
    const n = counts[p.key] ?? 0;
    out[p.key] = n ? Math.round((sums[p.key] / n)) : 0; // 0..10
  }
  return out;
}

function computeGlobal(scores){
  // average of 6 pillars => /10 then *10 => /100
  const vals = PILLARS.map(p => clamp(scores[p.key] ?? 0, 0, 10));
  const avg = vals.reduce((a,b)=>a+b,0) / vals.length; // 0..10
  return Math.round(avg * 10); // 0..100
}

/* =====================
   Helpers: pillar navigation
===================== */
function firstQuestionIndexForPillar(pillarKey){
  return QUESTIONS.findIndex(q => q.pillar === pillarKey);
}
function lastQuestionIndexForPillar(pillarKey){
  let idx = -1;
  QUESTIONS.forEach((q,i)=>{ if(q.pillar===pillarKey) idx=i; });
  return idx;
}
function isFirstQuestionOfPillar(qIndex){
  const q = QUESTIONS[qIndex];
  const first = firstQuestionIndexForPillar(q.pillar);
  return qIndex === first;
}
function isLastQuestionOfPillar(qIndex){
  const q = QUESTIONS[qIndex];
  const last = lastQuestionIndexForPillar(q.pillar);
  return qIndex === last;
}

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
