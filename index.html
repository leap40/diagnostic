:root{
  --blue:#110654;
  --bg:#110654;
  --red:#f70611;
  --violet:#7301e9;
  --white:#ffffff;
  --card: rgba(255,255,255,.08);
  --card2: rgba(255,255,255,.12);
  --line: rgba(255,255,255,.18);
  --muted: rgba(255,255,255,.75);
  --shadow: 0 18px 50px rgba(0,0,0,.35);
  --r:18px;
  --r2:24px;
  --sans: 'DM Sans', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  --serif: 'Playfair Display', Georgia, serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
}

.hero-logo{
  width:260px;
  height:auto;
  display:block;
  margin-bottom:30px;
}

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:var(--sans);
      background: linear-gradient(135deg, #110654 0%, #1a0a6e 40%, #0d0440 70%, #07022a 100%);
      color:var(--white);
      min-height:100vh;
    }
    .wrap{max-width:980px;margin:0 auto;padding:18px 14px 34px;}
    .topbar{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:10px 0;
    }
   .brand{display:flex;align-items:center;gap:10px;}
.logo{
  width:70px;
  height:auto;
  border:none;
  background:transparent;
  padding:0;
  border-radius:0;
    }
    .brand-title{display:flex;flex-direction:column;gap:2px;}
    .brand-title .t{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px;}
    .brand-title .s{font-size:12px;color:var(--muted);}

    .card{
      border:1px solid var(--line);
      border-radius:var(--r2);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.05));
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .card-h{
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
      background: rgba(255,255,255,.06);
    }
    .card-h h1,.card-h h2{margin:0}
    .card-b{padding:18px}

  .btn{
  border:1px solid transparent;
  padding:14px 22px;
  border-radius:14px;
  cursor:pointer;
  font-weight:700;
  font-size:14px;           /* ← taille unifiée */
  letter-spacing:.02em;
  transition:.15s ease;
  user-select:none;
  text-decoration:none;     /* important pour les <a> */
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
    .btn:hover{transform: translateY(-1px); background: rgba(255,255,255,.14);}
    .btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}
    .btn.red{
      background: var(--red);
      border-color: rgba(255,255,255,.18);
      box-shadow: 0 14px 30px rgba(247,6,17,.25);
color: white;              /* ← AJOUT IMPORTANT */

}
    }
    .btn.red:hover{background:#ff0b17}
    .btn.ghost{
      background: transparent;
      border:1px solid var(--line);
color: white;              /* ← AJOUT IMPORTANT */

    }

    .hero{
      padding:34px 20px;
      text-align:left;
    }
    .hero h1{
      font-size:42px;
      line-height:1.02;
      margin:0;
      letter-spacing:.02em;
      text-transform:uppercase;
      color:var(--red);
      font-weight:900;
    }
    .hero p{
      margin:12px 0 0;
      font-size:18px;
      color:var(--white);
      max-width:560px;
    }
    .hero-actions{
      display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    }

    .pill{
      display:inline-flex;align-items:center;gap:10px;
      padding:8px 12px;border-radius:999px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.06);
      font-family: var(--mono);
      font-size:14px;
 font-weight:700;
      color: var(--muted);

}
    }
    .progress{
      height:10px;border-radius:999px;overflow:hidden;
      border:1px solid var(--line);
      background: rgba(255,255,255,.08);
      margin-top:10px;
    }
    .progress>div{
      height:100%;width:0%;
      background: linear-gradient(90deg, var(--red), rgba(255,255,255,.85));
      transition: width .25s ease;
    }

    .q-title{margin:0;font-size:22px;font-weight:900}
    .q-help{margin:8px 0 0;color:var(--muted);font-size:13px}
    .options{display:flex;flex-direction:column;gap:10px;margin-top:14px}
    .opt{
      border:1px solid var(--line);
      border-radius:var(--r);
      background: rgba(255,255,255,.06);
      padding:12px 12px;
      display:flex;justify-content:space-between;gap:12px;align-items:center;
      cursor:pointer;
      transition:.12s ease;
    }
    .opt:hover{background: rgba(255,255,255,.10); transform: translateY(-1px)}
    .opt.sel{border-color: rgba(255,255,255,.5); background: rgba(255,255,255,.12)}
    .opt .lab{font-size:14px;color:var(--white)}
    .opt .sc{font-family:var(--mono);font-size:12px;color:var(--muted)}

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:14px;
    }
    @media (max-width:860px){ .grid{grid-template-columns:1fr} .hero h1{font-size:34px} }

    .field{
      border:1px solid var(--line);
      border-radius:var(--r);
      background: rgba(255,255,255,.06);
      padding:12px 12px;
      display:flex;flex-direction:column;gap:8px;
    }
    .field label{font-size:12px;color:var(--muted)}
    input, textarea{
      width:100%;
      border:none;outline:none;
      background: transparent;
      color: var(--white);
      font-size:14px;
      font-family: var(--sans);
    }
    textarea{min-height:110px;resize:vertical}
    .muted{color:var(--muted)}
    .sep{height:1px;background:var(--line);margin:16px 0}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

    .resultBox{
      border:1px solid var(--line);
      border-radius:var(--r2);
      background: rgba(255,255,255,.06);
      padding:16px;
    }
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;font-size:13px}
    th{color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
    tr:last-child td{border-bottom:none}

    .toast{
      position:fixed;right:16px;bottom:16px;
      border:1px solid var(--line);
      background: rgba(0,0,0,.35);
      padding:12px 12px;border-radius:16px;
      box-shadow: var(--shadow);
      max-width:360px;
      display:none;
    }
    .toast.show{display:block}
    .toast .tt{margin:0;font-weight:900}
    .toast .tm{margin:6px 0 0;color:var(--muted);font-size:13px}

.topbar img{
  width:200px !important;
  height:auto !important;
}
.pill-profile{
  background: #7301e9;
  border: none;
  box-shadow: 0 10px 25px rgba(115, 1, 233, 0.45);
  color: white;
}

.pill-profile b{
  font-weight:800;
}
.btn-download{
  background:#7301e9;
  border:none;
  color:white;
  text-decoration:none;   /* enlève le soulignement */
  box-shadow:0 12px 28px rgba(115,1,233,.45);
}

.btn-download:hover{
  background:#5e00c7;
  transform:translateY(-2px);
}
.hero-logo{
  width:260px;
  height:auto;
  display:block;
  margin-bottom:30px;
}

.topbar{flex-wrap:wrap; gap:10px;}
.brand{min-width:0;}
.topbar .row{display:flex; gap:10px; flex-wrap:wrap; min-width:0;}
.pill{min-width:0; max-width:100%;}

#pillPillar{
  white-space:normal;
  overflow-wrap:anywhere;
}

@media (max-width:520px){
  .brand{width:100%;}
  .topbar .row{
    width:100%;
    justify-content:flex-start;
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
  }

  #pillStep{
    font-size:12px;
    padding:7px 10px;
  }

  #pillPillar{
    width:100%;
    font-size:12px;
    padding:7px 10px;
  }
}

/* =====================
   Wizard flow:
   - Intro
   - Cover per pillar
   - Question pages
   - Result page + profile + email module (calls /api/send-report)
===================== */

const STORAGE_KEY = "diag_marketing_v1";

const view = document.getElementById("view");
const viewTitle = document.getElementById("viewTitle");
const progressBar = document.getElementById("progressBar");
const topbar = document.getElementById("topbar");
const pillStep = document.getElementById("pillStep");
const pillPillar = document.getElementById("pillPillar");
const navTop = document.getElementById("navTop");
const btnRestart = document.getElementById("btnRestart");

const toastEl = document.getElementById("toast");
const toastT = document.getElementById("toastT");
const toastM = document.getElementById("toastM");

let state = loadState() || {
  step: "intro",             // intro | cover | question | result
  coverIndex: 0,             // 0..5
  qIndex: 0,                 // 0..QUESTIONS.length-1
  answers: {},               // qid => 'A'|'B'|'C'|'D'
};

btnRestart?.addEventListener("click", () => {
  if (!confirm("Recommencer et effacer les réponses ?")) return;
  state = { step:"intro", coverIndex:0, qIndex:0, answers:{} };
  saveState();
  render();
});

function render(){
  const totalScreens = 1 + PILLARS.length + QUESTIONS.length + 1; // intro + 6 covers + 24 Q + result
  let currentScreen = 1;

  if (state.step === "intro") currentScreen = 1;
  else if (state.step === "cover") currentScreen = 1 + (state.coverIndex + 1);
  else if (state.step === "question") currentScreen = 1 + PILLARS.length + (state.qIndex + 1);
  else currentScreen = totalScreens;

  const prog = Math.round((currentScreen / totalScreens) * 100);
  progressBar.style.width = prog + "%";

  // Top bar hidden on intro, visible after
  const showTop = state.step !== "intro";
  topbar.style.display = showTop ? "flex" : "none";
  navTop.style.display = showTop ? "flex" : "none";

  if (state.step === "intro") return renderIntro();
  if (state.step === "cover") return renderCover();
  if (state.step === "question") return renderQuestion();
  return renderResult();
}

    state.step = "cover";
    state.coverIndex = 0;
    saveState();
    render();
  });
  document.getElementById("btnReset").addEventListener("click", () => {
    if (!confirm("Effacer les réponses enregistrées ?")) return;
    localStorage.removeItem(STORAGE_KEY);
    state = { step:"intro", coverIndex:0, qIndex:0, answers:{} };
    render();

function renderCover(){
  const p = PILLARS[state.coverIndex];
  viewTitle.textContent = "Pilier";
  pillStep.textContent = `Pilier ${state.coverIndex+1}/${PILLARS.length}`;
  pillPillar.textContent = p.label;

  view.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="resultBox">
        <h2 class="q-title" style="margin:0;">${escapeHtml(p.coverTitle)}</h2>
        <p class="q-help">${escapeHtml(p.coverText)}</p>
      </div>

      <div class="row">
        <button class="btn ghost" id="btnBackIntro">Retour</button>
        <button class="btn red" id="btnGo">Continuer</button>
      </div>
    </div>
  `;

  document.getElementById("btnBackIntro").addEventListener("click", () => {
    if (state.coverIndex === 0 && Object.keys(state.answers).length === 0){
      state.step = "intro";
    } else {
      // revient sur écran précédent logique: si coverIndex>0 => dernière question du pilier précédent
      if (state.coverIndex > 0){
        state.step = "question";
        // positionner sur dernière question du pilier précédent
        const prevPillarKey = PILLARS[state.coverIndex-1].key;
        const idx = lastQuestionIndexForPillar(prevPillarKey);
        state.qIndex = Math.max(0, idx);
      } else {
        state.step = "intro";
      }
    }
    saveState(); render();
  });

  document.getElementById("btnGo").addEventListener("click", () => {
    // Start pillar questions
    state.step = "question";
    state.qIndex = firstQuestionIndexForPillar(p.key);
    saveState();
    render();
  });
}

function renderQuestion(){
  const q = QUESTIONS[state.qIndex];
  const p = PILLARS.find(x => x.key === q.pillar);
  viewTitle.textContent = "Question";
  pillStep.textContent = `Q ${state.qIndex+1}/${QUESTIONS.length}`;
  pillPillar.textContent = p?.label || "—";

  const chosen = state.answers[q.id];

  view.innerHTML = `
    <div class="resultBox">
      <h2 class="q-title">${escapeHtml(q.title)}</h2>
      ${q.help ? `<p class="q-help">${escapeHtml(q.help)}</p>` : ``}
      <div class="options" id="opts">
        ${["A","B","C","D"].map(k => `
          <div class="opt ${chosen===k ? "sel":""}" data-k="${k}">
            <div class="lab"><b>${k}</b>. ${escapeHtml(q.options[k])}</div>
            <div class="sc"></div>
          </div>
        `).join("")}
      </div>
    </div>

    <div class="row" style="margin-top:14px;">
      <button class="btn ghost" id="btnPrev">Précédent</button>
      <button class="btn red" id="btnNext">${state.qIndex === QUESTIONS.length-1 ? "Voir les résultats" : "Suivant"}</button>
    </div>
  `;

  document.querySelectorAll("[data-k]").forEach(el => {
    el.addEventListener("click", () => {
      const k = el.getAttribute("data-k");
      state.answers[q.id] = k;
      saveState();
      render(); // refresh selection
    });
  });

  document.getElementById("btnPrev").addEventListener("click", () => {
    // If at first question of a pillar, go back to its cover
    if (isFirstQuestionOfPillar(state.qIndex)){
      const pillarIndex = PILLARS.findIndex(x => x.key === q.pillar);
      state.step = "cover";
      state.coverIndex = Math.max(0, pillarIndex);
      saveState(); render();
      return;
    }
    state.qIndex = Math.max(0, state.qIndex - 1);
    saveState(); render();
  });

  document.getElementById("btnNext").addEventListener("click", () => {
    if (!state.answers[q.id]){
      toast("Réponse manquante", "Choisissez A, B, C ou D pour continuer.");
      return;
    }

    // If leaving last question of a pillar, go to next pillar cover (if any)
    if (isLastQuestionOfPillar(state.qIndex)){
      const pillarIndex = PILLARS.findIndex(x => x.key === q.pillar);
      if (pillarIndex < PILLARS.length - 1){
        state.step = "cover";
        state.coverIndex = pillarIndex + 1;
        saveState(); render();
        return;
      }
    }

    // end
    if (state.qIndex >= QUESTIONS.length - 1){
      state.step = "result";
      saveState(); render();
      return;
    }

    state.qIndex += 1;
    saveState(); render();
  });
}

  // store result snapshot for later if needed
  saveState();
}

/* =====================
   Scoring
===================== */
function computePillarScores(answers){
  const out = {};
  for (const p of PILLARS) out[p.key] = 0;

  // accumulate per pillar
  const sums = {};
  const counts = {};
  for (const q of QUESTIONS){
    const a = answers[q.id];
    if (!a) continue;
    const s = SCORE_MAP[a] ?? 0;
    sums[q.pillar] = (sums[q.pillar] ?? 0) + s;
    counts[q.pillar] = (counts[q.pillar] ?? 0) + 1;
  }
  for (const p of PILLARS){
    const n = counts[p.key] ?? 0;
    out[p.key] = n ? Math.round((sums[p.key] / n)) : 0; // 0..10
  }
  return out;
}

function computeGlobal(scores){
  // average of 6 pillars => /10 then *10 => /100
  const vals = PILLARS.map(p => clamp(scores[p.key] ?? 0, 0, 10));
  const avg = vals.reduce((a,b)=>a+b,0) / vals.length; // 0..10
  return Math.round(avg * 10); // 0..100
}

/* =====================
   Helpers: pillar navigation
===================== */
function firstQuestionIndexForPillar(pillarKey){
  return QUESTIONS.findIndex(q => q.pillar === pillarKey);
}
function lastQuestionIndexForPillar(pillarKey){
  let idx = -1;
  QUESTIONS.forEach((q,i)=>{ if(q.pillar===pillarKey) idx=i; });
  return idx;
}
function isFirstQuestionOfPillar(qIndex){
  const q = QUESTIONS[qIndex];
  const first = firstQuestionIndexForPillar(q.pillar);
  return qIndex === first;
}
function isLastQuestionOfPillar(qIndex){
  const q = QUESTIONS[qIndex];
  const last = lastQuestionIndexForPillar(q.pillar);
  return qIndex === last;
}

function loadState(){
  try{

    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function toast(title, msg){
  toastT.textContent = title;
  toastM.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(()=>toastEl.classList.remove("show"), 2800);
}
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
